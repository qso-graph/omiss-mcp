[project]
name = "omiss-mcp"
version = "0.4.1"
description = "MCP server for OMISS: net schedule, nets on the air, members, check-in history, Statehood, officers and awards"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "netlogger-mcp>=0.1.2",
    # Declared directly rather than leaned on. netlogger-mcp has carried certifi since
    # 0.2.0, so it arrives transitively today — but the floor above permits 0.1.x, and
    # measured 2026-10-18, "netlogger-mcp==0.1.10" resolves with no certifi at all.
    # Relying on a sibling's dependency is relying on somebody else's decision to keep
    # it, and that the somebody else is us makes it tempting, not safer
    # (qso-graph-devel#73).
    "certifi>=2026.10.19",
    "tzdata; sys_platform == 'win32'",  # the roster's US Eastern times; Windows has no zone data
]
keywords = [
    "amateur-radio", "ham-radio", "omiss", "sideband", "nets", "check-ins", "awards",
    "mcp", "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/omiss-mcp/"
Repository = "https://github.com/qso-graph/omiss-mcp"
Issues = "https://github.com/qso-graph/omiss-mcp/issues"

[project.scripts]
omiss-mcp = "omiss_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "jsonschema", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omiss_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it is adif-mcp's width — these repos were not written to
# it. It was deferred (qso-graph-devel#70) because on cq-zones-mcp it reported 39
# lines and not one was a defect: the rules that find defects went in first and
# this one waited. That pass is now done here (#36). E501 reported 112 lines in
# this repo, and not one of them was a defect either — which is the finding, not
# an argument against enforcing it.
#
# No line is exempt. The deferral note used to predict that publisher-field lines
# would need a `noqa`, and in this repo none did: omiss.net's own strings — its
# `GenAwardReport.php?AwardID=` links, its `<h3>` section titles, its form field
# names — all survive a reflow whole, because the break goes at a concatenation
# boundary or a list comma rather than through the literal. Where the length is
# genuinely the correctness, exempt the line and say which thing is exempted;
# here it never was.
select = ["E", "F", "I"]
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
