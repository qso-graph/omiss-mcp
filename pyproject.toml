[project]
name = "omiss-mcp"
version = "0.1.3"
description = "MCP server for OMISS: net schedule, nets on the air, members, check-in history, Statehood, officers and awards"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "ki7mt@yahoo.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "netlogger-mcp>=0.1.2",
]
keywords = [
    "amateur-radio", "ham-radio", "omiss", "sideband", "nets", "check-ins", "awards",
    "mcp", "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[project.urls]
Homepage = "https://qso-graph.io"
Repository = "https://github.com/qso-graph/omiss-mcp"
Issues = "https://github.com/qso-graph/omiss-mcp/issues"

[project.scripts]
omiss-mcp = "omiss_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omiss_mcp"]
